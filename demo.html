      if(moved)e.reminded=e.remind24=false;
      delete e.repeat;delete e.total;Object.assign(e,f);track('activity_edited');
      if(e.members.length)addMsg(e.id,'sys','The host updated the details'+(moved?`: now ${whenStr(when)} at ${venue}`:''));
      if(spots(e)<=0){if(e.status==='open')fillUp(e)}else spotOpened(e);
      save();ui.modal={type:'host',id:e.id};toast('Changes saved'+(e.members.length?'. Members see a note in the chat.':''));render();return;
    }
    S.acts.push({id:nextId('a'),host:'me',...f,hood:S.me.hood,members:[],status:'open'});
    track('post_created',{cat:f.cat,repeat:!!rep,audience:all?'everyone':'limited',cost:f.cost,template:!!ui.modal?.tpl});askMicro('post');
    save();ui.modal=null;ui.tab='acts';toast('Posted. Now visible to eligible people.');render();
  },
  editact:d=>{ui.modal={type:'post',id:d.id};render()},
  postagain:d=>{ui.modal={type:'post',tpl:d.id};render()},
  request:d=>{
    const note=val('r_note');
    gate(()=>{
      if(!sendReq(d.id,note))return;
      track('request_sent',{waitlist:myReq(d.id)?.status==='waitlist',note:!!note});askMicro('request');
      ui.modal=null;
      if(ui.tab==='swipe'&&!deck().length){ui.tab='discover';toast("Request sent. You've seen everything nearby, here's Discover.")}
      render();
    });
  },
  acc:d=>{accept(d.id);render()},
  rej:d=>{reject(d.id);render()},
  askreq:d=>{ui.modal={type:'confirm',id:d.id};render()},
  cancelact:d=>{ui.modal={type:'cancelconfirm',id:d.id};render()},
  withdraw:d=>{track('request_withdrawn');S.reqs=S.reqs.filter(r=>!(r.act===d.id&&r.user==='me'&&(r.status==='pending'||r.status==='waitlist')));save();toast('Request withdrawn');render()},
  leave:d=>{ui.modal={type:'leave',id:d.id,back:ui.modal};render()},
  doleave:d=>{const a=actOf(d.id);leaveAct(d.id,'me');track('left_activity');toast(`You left "${short(a.desc)}". ${uname(a.host)} has been told.`);ui.modal={type:'detail',id:d.id};render()},
  rate:d=>{ui.modal={type:'rate',id:d.id,back:ui.modal};render()},
  dorate:d=>{
    const a=actOf(d.id);if(!a)return;
    const st=document.querySelector('input[name=rt_star]:checked');if(!st)return toast('Tap the stars to rate the meetup');
    const ok=document.querySelector('input[name=rt_ok]:checked')?.value||'yes',people={};
    [a.host,...a.members].filter(x=>x!=='me').forEach(u=>{people[u]=document.querySelector(`input[name="rt_${u}"]:checked`)?.value||'show'});
    S.ratings[a.id]={at:now(),ok,stars:+st.value,people};
    if(ok==='no')S.reports.push({act:a.id,reason:'Check-in: something went wrong',at:now()});
    track('rating_submitted',{stars:+st.value,ok});askMicro('rating');
    save();ui.modal=null;toast(ok==='no'?'Thanks for telling us. Our safety team will follow up with you.':'Thanks! Your rating helps keep meetups reliable.');render();
  },
  report:d=>{ui.modal={type:'report',id:d.id,back:ui.modal};render()},
  dorep:d=>{
    const r=document.querySelector('input[name=rp_r]:checked');if(!r)return toast('Pick what happened');
    S.reports.push({user:d.id,reason:r.value,note:document.getElementById('rp_note').value.trim(),at:now()});
    const bl=!!document.getElementById('rp_block')?.checked;if(bl)blockUser(d.id);save();track('report_sent',{kind:'user',reason:r.value,block:bl});
    ui.modal=ui.modal.back||null;toast('Report sent. Our safety team reviews reports within 24 hours.'+(bl?` ${uname(d.id)} is blocked.`:''));render();
  },
  block:d=>{blockUser(d.id);track('block');toast(`Blocked ${uname(d.id)}. You won't see their activities and they can't request yours.`);render()},
  unblock:d=>{S.blocked=S.blocked.filter(x=>x!==d.id);save();toast(`Unblocked ${uname(d.id)}`);render()},
  share:d=>{track('share_opened',{kind:d.k});ui.modal={type:'share',id:d.id,k:d.k,back:ui.modal};render()},
  follow:d=>{const on=S.following.includes(d.id);S.following=on?S.following.filter(x=>x!==d.id):[...S.following,d.id];save();track(on?'unfollow':'follow');toast(on?`Unfollowed ${uname(d.id)}`:`Following ${uname(d.id)}. You'll hear when they post.`);render()},
  mute:d=>{S.muted[d.id]=!S.muted[d.id];save();track('chat_mute',{on:S.muted[d.id]});toast(S.muted[d.id]?'Chat muted. You can still open it any time.':'Chat notifications on');render()},
  tipsok:d=>{S.tips[d.id]=true;save();render()},
  newpoll:d=>{ui.modal={type:'poll',id:d.id,back:ui.modal};render()},
  dopoll:d=>{
    const q=val('pl_q'),opts=[0,1,2,3].map(i=>val('pl_o'+i)).filter(Boolean);
    if(!q||opts.length<2)return toast('Add a question and at least 2 options');
    (S.chats[d.id]=S.chats[d.id]||[]).push({from:'me',at:now(),text:'Poll: '+q,poll:{q,opts:opts.map(t=>({t,v:[]}))}});
    save();track('poll_created',{options:opts.length});ui.modal=ui.modal.back||{type:'chat',id:d.id};render();
    const i=S.chats[d.id].length-1;
    setTimeout(()=>{const a=actOf(d.id),x=S.chats[d.id]?.[i];if(!a||!x)return;const ppl=[a.host,...a.members].filter(u=>u!=='me'),voters=ppl.filter(()=>Math.random()<.8);(voters.length?voters:ppl.slice(0,1)).forEach(u=>x.poll.opts[Math.floor(Math.random()*x.poll.opts.length)].v.push(u));save();if(ui.modal?.type==='chat'&&ui.modal.id===d.id)render()},1500);
  },
  vote:d=>{const x=S.chats[d.id]?.[+d.m];if(!x?.poll)return;const was=x.poll.opts[+d.o].v.includes('me');x.poll.opts.forEach(o=>{o.v=o.v.filter(u=>u!=='me')});if(!was)x.poll.opts[+d.o].v.push('me');save();track('poll_vote');render()},
  msgrep:d=>{ui.modal={type:'msgrep',id:d.id,m:+d.m,back:ui.modal};render()},
  domsgrep:d=>{
    const x=S.chats[d.id]?.[+d.m],r=document.querySelector('input[name=mr_r]:checked');if(!x)return;if(!r)return toast('Pick what is wrong with it');
    const bl=!!document.getElementById('mr_block')?.checked;
    S.reports.push({user:x.from,act:d.id,msg:x.text,reason:r.value,at:now()});x.reported=true;if(bl)blockUser(x.from);save();
    track('report_sent',{kind:'message',reason:r.value,block:bl});ui.modal=ui.modal.back||null;toast('Message reported. Our safety team reviews reports within 24 hours.');render();
  },
  sos:d=>{track('sos_opened');ui.modal={type:'sos',id:d.id,back:ui.modal?.type==='safe'?null:ui.modal,locState:'wait'};render();getLoc()},
  sosloc:()=>{ui.modal.locState='wait';render();getLoc()},
  safeok:d=>{const a=actOf(d.id);if(a){a.arrive='ok'}save();track('safe_checkin',{answer:'ok'});ui.modal=null;toast("Great, have fun! We'll check in again afterwards.");render()},
  microans:d=>{const k=ui.micro;if(!k)return;track('micro_feedback',{moment:k,score:+d.n});S.asked[k]=true;ui.micro=null;save();toast('Thanks! That helps us improve.');render()},
  microx:()=>{const k=ui.micro;if(k){track('micro_dismissed',{moment:k});S.asked[k]=true}ui.micro=null;save();render()},
  theme:d=>{try{localStorage.setItem('overhere_theme',d.k)}catch(e){}applyTheme(d.k);track('theme',{mode:d.k});render()},
  install:()=>{if(!installEvt)return;installEvt.prompt();installEvt.userChoice.then(c=>{track('pwa_install',{outcome:c.outcome});installEvt=null;render()}).catch(()=>{})},
  simpost:()=>{const pool=Object.keys(USERS).filter(u=>!isBlocked(u));simPost(pool[Math.floor(Math.random()*pool.length)]);ui.modal=null;render()},
  simfollow:()=>{const u=S.following.find(x=>!isBlocked(x));if(!u)return toast('Follow a host first: open their profile and tap Follow');simPost(u);ui.modal=null;render()},
  simstart:()=>{
    const a=S.acts.filter(x=>attended(x)&&x.members.length&&x.when>now()).sort((x,y)=>x.when-y.when)[0];
    if(!a)return toast('Join or host a plan with other people first');
    S.offset+=a.when-now()+6e4;tick();save();ui.modal=null;render();
  },
  edittrusted:()=>{ui.modal.edit=true;render()},
  savetrusted:()=>{
    const name=val('t_name'),phone=val('t_phone');
    if(!name||phone.replace(/\D/g,'').length<7)return toast('Add a name and a valid phone number');
    S.me.trusted={name,phone};save();toast('Trusted contact saved');
    if(ui.modal?.type==='share')ui.modal.edit=false;
    render();
  },
  copyshare:()=>{
    const t=document.getElementById('sh_txt');if(!t)return;
    const done=()=>toast('Copied');
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(done).catch(()=>{t.select();try{document.execCommand('copy');done()}catch(e){toast('Select the text and copy it')}});
  },
  nshare:()=>{const t=document.getElementById('sh_txt');if(t&&navigator.share)navigator.share({text:t.value}).catch(()=>{})},
  signout:()=>{try{localStorage.removeItem('overhere_acct')}catch(e){}location.reload()},
  simleave:()=>{
    const a=S.acts.find(x=>x.host!=='me'&&x.status==='full'&&waitlist(x.id).some(r=>r.user==='me'))||S.acts.find(x=>x.host==='me'&&!isPast(x)&&x.members.length);
    if(!a)return toast('Join a waitlist, or accept someone into your activity first');
    const u=a.members.find(x=>x!=='me');if(!u)return toast('Nobody else is in that activity');
    leaveAct(a.id,u);toast(`${uname(u)} left "${short(a.desc)}"`);render();
  },
  docancel:d=>{cancelAct(d.id,'me');ui.modal=null;render()},
  send:d=>{
    const t=val('c_in');if(!t)return;
    addMsg(d.id,'me',t);save();track('chat_message');render();
    document.getElementById('c_in')?.focus();
    setTimeout(()=>{if(ui.modal?.type==='chat'&&ui.modal.id===d.id)simReply(d.id)},1400);
  },
  saveprofile:()=>{
    const name=val('p_name'),dob=val('p_dob'),tn=val('t_name'),tp=val('t_phone');
    if(!name)return toast('Add your name');
    if(!dob||!(ageOf(dob)>=18))return toast('Check your date of birth: you must be 18 or over');
    if((tn||tp)&&(!tn||tp.replace(/\D/g,'').length<7))return toast('Add a name and a valid phone for your trusted contact, or leave both empty');
    Object.assign(S.me,{name,dob,gender:val('p_gender'),hood:val('p_hood'),job:val('p_job'),bio:document.getElementById('p_bio').value.trim(),ints:many('p_int'),avail:many('p_avail')});
    if(tn)S.me.trusted={name:tn,phone:tp};else delete S.me.trusted;
    if(ui.modal?.emo){S.me.emo=ui.modal.emo;delete S.me.photo}
    track('profile_saved');save();ui.modal=null;toast('Profile saved');render();
  },
  editprofile:d=>{ui.modal={type:'editprofile'};render();if(d.k==='safety')document.getElementById('ep_safety')?.scrollIntoView({block:'start'})},
  /* In the edit sheet the emoji is applied on Save; update the preview without losing typed changes. */
  pickemo:d=>{
    ui.modal.emo=d.e;
    document.querySelectorAll('[data-a=pickemo]').forEach(b=>{const on=b.dataset.e===d.e;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
    const pv=document.getElementById('ep_av');if(pv)pv.innerHTML=`<span class="av emo lg" style="background:${PASTEL[0]}" aria-hidden="true">${esc(d.e)}</span>`;
  },
  emojipick:()=>{photoMenu(false);ui.modal={type:'emoji'};render()},
  setemo:d=>{S.me.emo=d.e;delete S.me.photo;save();track('avatar_emoji');ui.modal=null;toast('Emoji updated');render()},
  /* No photo yet: go straight to the picker. Otherwise offer change/remove. */
  photo:()=>{photoMenu(document.getElementById('p_menu')?.hidden)},
  pickphoto:()=>{photoMenu(false);(document.getElementById('p_photo')||photoInput()).click()},
  rmphoto:()=>{photoMenu(false);delete S.me.photo;save();toast('Photo removed. Showing your emoji.');if(ui.modal?.type==='editprofile')render();else refreshMyPhoto()},
  adv:d=>{S.offset+=+d.h*3600e3;tick();save();toast('Moved forward '+d.h+' hours');render()},
  simreq:()=>{incoming();render()},
  simacc:()=>hostDecide(true),
  simrej:()=>hostDecide(false),
  simcancel:()=>{
    const a=S.acts.find(x=>x.host!=='me'&&x.members.includes('me'));
    if(!a)return toast('You are not accepted into any activity yet');
    cancelAct(a.id,a.host);ui.modal=null;render();
  },
  simreply:()=>{
    if(ui.modal?.type==='chat')return simReply(ui.modal.id);
    const a=S.acts.find(x=>S.chats[x.id]&&attended(x)&&!isPast(x));
    if(!a)return toast('You are not in any group chat yet');
    ui.modal=null;simReply(a.id);render();
  },
  togfail:()=>{S.forceFail=document.getElementById('d_fail').checked;save()},
  approve:()=>{['face','kyc'].forEach(k=>{if(S.me[k+'Flag']){S.me[k+'Flag']=false;S.me[k+'Fails']=0;S.me[k]=true}});save();toast('Reviewer approved flagged verifications');render()},
  resetkyc:()=>{S.me.kyc=false;S.me.kycFails=0;S.me.kycFlag=false;save();toast('ID verification reset');render()},
  reset:()=>{try{localStorage.removeItem(SKEY)}catch(e){}S=seed();ui=freshUi();initMe();render()},
  /* onboarding */
  ob0:()=>{
    const d=ui.ob.d;d.phone=val('o_phone');d.email=val('o_email');
    if(d.phone.replace(/\D/g,'').length<7||!/.+@.+\..+/.test(d.email))return toast('Enter a valid phone and email');
    ui.ob.step=1;render();
  },
  mail:()=>{ui.ob.d.mail=true;const b=document.getElementById('o_mailbtn');if(b)b.textContent='✓ Confirmed'},
  ob1:()=>{
    if(!/^\d{4}$/.test(val('o_otp')))return toast('Enter any 4-digit code');
    if(!ui.ob.d.mail)return toast('Confirm your email link first');
    ui.ob.step=2;render();
  },
  ob2:()=>{
    const d=ui.ob.d;d.name=val('o_name');d.dob=val('o_dob');d.gender=val('o_gender');d.hood=val('o_hood');d.ints=many('o_int');d.avail=many('o_avail');
    if(!d.name||!d.dob||!d.gender)return toast('Name, date of birth and gender identity are required');
    if(ageOf(d.dob)<18)return toast('You must be 18 or over (demo rule)');
    S.me={name:d.name,dob:d.dob,gender:d.gender,hood:d.hood,ints:d.ints,avail:d.avail,face:true,kyc:true,obDone:false,emo:defEmo(d.gender)};
    save();render();
  },
  obface:()=>openVerify('face',()=>render()),
  obdone:d=>{
    if(d.save)Object.assign(S.me,{job:val('o_job'),bio:val('o_bio')});
    track('onboarding_done',{details:!!d.save});
    S.me.obDone=true;save();ui.tab='swipe';render();
  }
};
function hostDecide(yes){
  const r=S.reqs.find(x=>x.user==='me'&&x.status==='pending'&&actOf(x.act));
  if(!r)return toast('You have no pending requests');
  yes?accept(r.id):reject(r.id);render();
}
function simReply(actId){
  const a=actOf(actId);if(!a)return;
  const others=[a.host,...a.members].filter(x=>x!=='me');
  if(!others.length)return;
  const from=others[Math.floor(Math.random()*others.length)],text=REPLIES[Math.floor(Math.random()*REPLIES.length)];
  addMsg(actId,from,text);
  const open=ui.modal?.type==='chat'&&ui.modal.id===actId;
  if(!open&&!S.muted[actId])notify(`${uname(from)}: ${text}`,{kind:'update',title:`New message in "${short(a.desc)}"`,tag:'Chat',tone:'info',act:actId,chat:true});
  save();if(open)render();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.phw'))photoMenu(false);
  if(e.target.matches('input[type=checkbox]')&&e.target.id!=='d_fail'){
    if(e.target.id==='f_all'&&e.target.checked)document.querySelectorAll('.f_g').forEach(x=>x.checked=false);
    else if(e.target.classList.contains('f_g')&&e.target.checked)document.getElementById('f_all').checked=false;
  }
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='closebg'){A.closebg(el.dataset,e);return}
  const fn=A[el.dataset.a];if(fn){e.stopPropagation();fn(el.dataset,e)}
});
document.addEventListener('input',e=>{if(e.target.id==='r_note'){const c=document.getElementById('r_cnt');if(c)c.textContent=e.target.value.length}});
document.addEventListener('change',e=>{
  if(e.target.id==='d_from'||e.target.id==='d_to'){
    const f=ui.f;f[e.target.id==='d_from'?'dfrom':'dto']=e.target.value;
    if(f.dfrom&&f.dto&&f.dfrom>f.dto)[f.dfrom,f.dto]=[f.dto,f.dfrom];
    track('filter',{type:'date'});render()}
  if(e.target.id==='f_tpl'&&ui.modal?.type==='post'){ui.modal.tpl=e.target.value||null;render()}
  if(e.target.id==='f_amin'||e.target.id==='f_amax'){
    ui.f[e.target.id==='f_amin'?'amin':'amax']=+e.target.value;
    if(ui.f.amin>ui.f.amax)[ui.f.amin,ui.f.amax]=[ui.f.amax,ui.f.amin];
    render();
  }
  if(e.target.id==='p_photo'){const f=e.target.files[0];e.target.value='';openCropper(f)}
});
document.addEventListener('keydown',e=>{
  const pm=document.getElementById('p_menu');
  if(e.key==='Escape'&&pm&&!pm.hidden){photoMenu(false);document.getElementById('p_pe')?.focus();return}
  if(e.key==='Enter'&&e.target.matches('[role=button][data-a]')){e.target.click();return}
  if(e.key==='Enter'&&e.target.id==='c_in'){const b=document.querySelector('[data-a=send]');if(b)b.click();return}
  if(e.key==='Escape'&&ui.modal&&ui.modal.type!=='verify'){ui.modal=ui.modal.back||null;render();return}
  if(ui.modal||ui.tab!=='swipe'||!S.me?.obDone||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft')swipe('left');
  else if(e.key==='ArrowRight')swipe('right');
});

/* A brand-new user: none of the seeded history that involves "me". */
function freshStart(){
  const mine=new Set(S.acts.filter(a=>a.host==='me').map(a=>a.id));
  S.acts=S.acts.filter(a=>a.host!=='me');S.acts.forEach(a=>{a.members=a.members.filter(x=>x!=='me')});
  S.reqs=S.reqs.filter(r=>r.user!=='me'&&!mine.has(r.act));
  mine.forEach(id=>delete S.chats[id]);
  if(S.chats.n2)S.chats.n2=S.chats.n2.filter(x=>x.text!=='You joined the chat');
  S.notes=[{id:'n0',at:now(),kind:'update',title:'Welcome to Overhere',tag:'',tone:'',act:null,read:false,text:'Swipe on plans happening soon, or browse Discover. You verify your ID once, the first time you request or post.'}];
}
function initMe(){
  if(S.me)return;
  const ac=ACCOUNTS[ACCT];
  if(ac){
    S.me={...ac,face:true,kyc:!ac.fresh,obDone:true};delete S.me.fresh;
    if(ac.fresh)freshStart();
    /* A man hosting: make his own sample activity and its request fit him. */
    if(ac.gender==='Man'){const m2=actOf('m2'),r3=S.reqs.find(r=>r.id==='r3'),n6=S.notes.find(n=>n.id==='n6');
      if(m2)m2.aud=['Man','Non-binary'];if(r3)r3.user='u3';if(n6)n6.text='Rohan wants to join "Late show and street food after".'}
    save();return;
  }
  try{
    const p=JSON.parse(localStorage.getItem('overhere_participant'));
    if(p&&p.name&&p.gender&&p.hood)S.me={name:p.name,dob:p.dob||'1995-01-01',gender:p.gender,hood:fixHood(p.hood),ints:p.ints||[],avail:p.avail||[],face:true,kyc:true,obDone:true,emo:defEmo(p.gender)};
  }catch(e){}
  if(S.me)save();
}
initMe();tick();render();
track('app_open',{standalone:isStandalone(),embedded:window.parent!==window});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme(themePref()));
applyTheme(themePref());
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(ui.tab==='profile'&&!ui.modal)render()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
/* Invite links open straight to the activity. */
(()=>{const mm=location.hash.match(/^#act=(\w+)$/),a=mm&&S.me?.obDone&&actOf(mm[1]);
  if(a){ui.modal={type:a.host==='me'?'host':'detail',id:a.id};render()}})();
setInterval(()=>{if(S.me&&tick()){if(!ui.modal)render()}},30000);
</script>
