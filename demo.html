<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tagalong - sample app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E6;--card:#FFFDF8;--ink:#1A1A1A;--mute:#6B6B6B;--line:#E7DFCF;--field:#EFE8DA;--acc:#3F7D4E;--acch:#336842;--acc2:#E7F0E1;--accink:#2E6139;--ok:#15803D;--okbg:#DCFCE7;--bad:#B91C1C;--badbg:#FEE2E2;--warn:#A16207;--warnbg:#FEF3C7;--info:#1D4ED8;--infobg:#DBEAFE;--grey:#EFE8DA;--shadow:0 2px 14px rgba(26,26,26,.06);--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:14.5px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#E8E0CF;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.i{flex:0 0 auto;vertical-align:-3px}
#shell{position:relative;width:min(100%,420px);height:min(100dvh,880px);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(60,40,20,.18)}
@media(min-width:500px){#shell{border-radius:28px;border:8px solid #1A1A1A}}
@media(min-width:900px){#shell{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
#screen{display:flex;flex-direction:column;flex:1;min-height:0}

/* header + nav */
header{background:var(--card);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em;flex:1}
.dots{display:flex;gap:2px}.dots i{width:11px;height:11px;border-radius:50%;background:#1A1A1A;box-shadow:inset 0 0 0 2.5px var(--acc)}
.tnav{display:none;gap:4px;align-items:center}
.tt{border:0;background:none;padding:8px 16px;border-radius:99px;color:var(--mute);cursor:pointer;font-weight:500;font-size:14px;transition:.15s}
.tt:hover{color:var(--ink)}
.tt.on{background:var(--acc2);color:var(--acch)}
.hr{display:flex;align-items:center;gap:4px}
.ib{border:0;background:none;width:38px;height:38px;border-radius:50%;cursor:pointer;position:relative;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:var(--grey)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid #fff}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto}
.av.sm{width:24px;height:24px;font-size:11px}
.av.lg{width:72px;height:72px;border-radius:20px;font-size:28px;box-shadow:0 6px 16px rgba(26,26,26,.12)}
main{flex:1;overflow-y:auto;padding:18px 16px;min-height:0}
.wrap{max-width:1180px;margin:0 auto}.narrow{max-width:620px;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:10.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
nav button.on{color:var(--acc);font-weight:700}
@media(min-width:900px){.tnav{display:flex}nav,.mobonly{display:none!important}.logo,.hr{flex:1 1 0}.hr{justify-content:flex-end}main{padding:28px 32px}}
@media(max-width:899px){.kb{display:none}}

/* type */
.pt{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 2px;line-height:1.2}
.sub{color:var(--mute);font-size:13px;margin:0 0 18px}
h2{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{margin:18px 0 8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
p{margin:0 0 6px}
.mute{color:var(--mute)}.small{font-size:12.5px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd .btn{flex:0 0 auto}

/* buttons */
.btn{border:0;background:var(--acc);color:#fff;font-weight:600;padding:13px 18px;border-radius:99px;font-size:14.5px;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:hover{background:var(--acch)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--acc2);color:var(--accink)}.btn.sec:hover{background:#D8E8CF}
.btn.bad{background:var(--badbg);color:var(--bad)}.btn.bad:hover{background:#FECACA}
.btn.ok{background:var(--okbg);color:var(--ok)}.btn.ok:hover{background:#BBF7D0}
.btn.ghost{background:var(--grey);color:var(--ink)}.btn.ghost:hover{background:#E6DECE}
.btn.sm{width:auto;padding:8px 16px;font-size:13px}
.btn.xs{width:auto;padding:6px 12px 6px 14px;font-size:12px;gap:3px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}

/* forms */
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:14px;background:var(--field);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:#fff}
input::placeholder,textarea::placeholder{color:#A8A08E}
textarea{resize:none;min-height:96px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;margin:6px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;margin:0;border:1px solid var(--line);border-radius:99px;padding:9px 16px;background:#fff;font-weight:500;font-size:13.5px;cursor:pointer;transition:.15s}
.opt:hover{border-color:#D6CCB8}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2);color:var(--accink)}
.opt input{margin:0}

/* panels, chips */
.panel{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel.tap{cursor:pointer;transition:transform .15s}.panel.tap:hover{transform:translateY(-1px)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--grey);color:var(--mute)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.acc{background:var(--acc2);color:var(--accink)}.chip.info{background:var(--infobg);color:var(--info)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff}
.vf{color:var(--acc);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fc{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:.15s}
.fc:hover{border-color:#D6CCB8}
.fc.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.fc b{font-weight:600;background:rgba(0,0,0,.06);border-radius:99px;padding:0 7px;font-size:11px}
.fc.on b{background:rgba(255,255,255,.25)}

/* swipe */
.deck{display:flex;flex-direction:column;align-items:center;text-align:center}
.stack{position:relative;width:100%;max-width:320px;height:min(470px,60dvh);margin:0 auto}
.card{position:absolute;inset:0;border-radius:28px;color:#fff;overflow:hidden;touch-action:none;user-select:none;box-shadow:0 18px 40px rgba(26,26,26,.22);text-align:left;cursor:grab}
.card.back{transform:scale(.94) translateY(14px);opacity:.6}
.card .art{position:absolute;inset:0;display:flex;justify-content:center;padding-top:22%;color:rgba(255,255,255,.13)}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 28%,rgba(0,0,0,.5) 52%,rgba(12,9,6,.93) 100%)}
.card .cp{position:absolute;top:14px;left:14px}
.card .body{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px}
.card .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}
.card .vf{color:#A7D7A0}
.card h2{font-size:20px;line-height:1.25;margin:0 0 6px;font-weight:600}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;font-weight:500;opacity:.92;margin-top:8px}
.card .meta span{display:inline-flex;align-items:center;gap:5px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card .tags span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
.stamp{position:absolute;top:56px;right:18px;font-size:22px;font-weight:800;border:3px solid;border-radius:10px;padding:2px 10px;transform:rotate(12deg);opacity:0;z-index:2}
.acts{display:flex;align-items:center;justify-content:center;gap:26px;padding:24px 0 6px}
.rb{width:58px;height:58px;border-radius:50%;border:0;background:#fff;color:var(--mute);box-shadow:0 6px 18px rgba(26,26,26,.1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.rb:hover{transform:scale(1.06)}
.rb.go{background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(63,125,78,.35)}
.cnt{font-size:11.5px;color:var(--mute);line-height:1.6}

/* discover */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ac{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.ac:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(26,26,26,.1)}
.media{position:relative;height:150px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2)}
.media .cat{position:absolute;top:12px;left:12px}
.ac .bd{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
.ac h4{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.meta2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.meta2 span{display:inline-flex;align-items:center;gap:5px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg span{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--grey);color:var(--mute)}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.hn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;margin:16px 0}
.filters .f{flex:1 1 260px}
.filters label{margin:0 0 6px;font-weight:500;font-size:12.5px}

/* lists */
.li{display:flex;gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85)}
.li .t{font-weight:600;font-size:14.5px;line-height:1.3}

/* modal */
.ov{position:absolute;inset:0;background:rgba(20,16,10,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.full{height:96%}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh h2{flex:1;margin:0;font-size:16px;font-weight:600}
.sb{padding:16px 18px 20px;overflow-y:auto}
@media(min-width:720px){.ov{align-items:center;justify-content:center}.sheet{max-width:440px;border-radius:22px;max-height:90%}.sheet.full{height:auto}.sheet.wide{max-width:620px}.sheet.chat{height:80%;max-width:560px}}
.sum{display:flex;gap:14px;align-items:center;background:var(--grey);border-radius:18px;padding:14px}
.sum .thumb{width:72px;height:72px;border-radius:50%}
.sum .t{font-weight:600;font-size:15px;margin:5px 0 3px}
.hostline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:16px 0 2px}
.cc{text-align:right;font-size:11.5px;color:var(--mute);margin-top:4px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:14px;padding:12px 14px;font-size:12.5px;margin:14px 0}
.warnbox .i{color:#F59E0B;margin-top:1px}

/* notifications */
.nh{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.nh .ic{color:var(--acc);margin-top:4px}
.lnk{white-space:nowrap;border:0;background:none;color:var(--acc);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px}
.lnk.m{color:var(--mute);font-weight:500}
.nf{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.nc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px;position:relative}
.nc .top{display:flex;gap:12px;padding:16px 18px}
.nic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.nt{font-weight:600;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nx{font-size:13px;color:#3F3F3F;margin:3px 0 5px}
.tm{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:5px}
.unread{position:absolute;top:18px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.nb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 18px}
.pb{white-space:nowrap;border:0;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:var(--grey);color:var(--mute)}
.pb.o{background:var(--acc2);color:var(--accink)}
.pb.d{background:none;margin-left:auto}.pb.d:hover{color:var(--bad)}

/* profile */
.ph{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.ph .i{color:var(--acc)}
.ph .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--mute);font-size:12px}
.pt2{display:flex;gap:16px;align-items:center}
.pn{font-size:22px;font-weight:500;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--mute);margin:16px 0 10px}
.facts span{display:inline-flex;align-items:center;gap:5px}
.soft{display:flex;flex-wrap:wrap;gap:8px}
.soft span{background:var(--acc2);color:var(--accink);padding:6px 14px;border-radius:99px;font-size:13px}
.bar{height:6px;background:var(--grey);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.vg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vi{display:flex;align-items:center;gap:8px;border-radius:99px;padding:9px 14px;font-size:13px;border:1px solid var(--line);background:var(--grey);color:var(--mute)}
.vi .e{margin-left:auto;display:inline-flex}
.vi.y{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
@media(max-width:420px){.vg{grid-template-columns:1fr}}

/* chat, misc */
.msgs{flex:1;overflow-y:auto;padding:12px 18px;background:var(--bg)}
.msg{max-width:80%;margin-bottom:8px;padding:9px 13px;border-radius:18px 18px 18px 6px;background:#fff;box-shadow:var(--shadow)}
.msg.me{margin-left:auto;background:var(--acc);color:#fff;border-radius:18px 18px 6px 18px}
.msg .who{font-size:11px;font-weight:700;color:var(--acch)}
.msg.sys{margin:8px auto;background:none;box-shadow:none;font-size:12px;color:var(--mute);text-align:center;max-width:100%}
.cin{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.cin input{flex:1}.cin button{width:auto}
#toast{position:absolute;left:14px;right:14px;top:14px;z-index:50;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;opacity:0;transform:translateY(-12px);transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:none}
@media(min-width:900px){#toast{left:auto;right:24px;top:74px;width:360px}}
.ob{padding:28px 22px;overflow-y:auto;flex:1;width:100%}
@media(min-width:900px){.ob{max-width:520px;margin:0 auto}}
.scan{width:130px;height:130px;border-radius:50%;margin:18px auto;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center}
.scan.go{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.08);background:#D4E6CB}}
.dn{border-left:3px solid var(--acc);padding-left:10px;margin:10px 0;font-size:12.5px;color:var(--mute)}
.empty{text-align:center;padding:50px 20px;color:var(--mute);max-width:420px;margin:0 auto}
.empty .big{width:72px;height:72px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty h2{color:var(--ink)}
.empty .btn{width:auto;margin-top:10px}
</style>
</head>
<body>
<div id="shell"><div id="screen"></div><div id="toast"></div></div>
<script>
"use strict";
/* ---------- icons (Lucide, ISC licence) ---------- */
const IC={
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  'calendar-check':'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  'map-pin':'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  'user-check':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  'bell-off':'<path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/>',
  'settings-2':'<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  'message-circle':'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',

  S.reqs=S.reqs.filter(r=>r.act!==id);
  delete S.chats[id];
  if(byHost==='me')notify(a.members.length?a.members.length+' accepted member(s) notified.':'Removed from your list.',{kind:'update',title:'Activity cancelled',tag:'Cancelled',tone:'bad'});
  else if(wasMember)notify(`${uname(byHost)} cancelled "${short(a.desc)}".`,{kind:'update',title:'Activity cancelled',tag:'Cancelled',tone:'bad'});
  save();
}
function tick(){
  let ch=false;
  S.acts.forEach(a=>{
    if(a.status!=='past'&&!a.reminded&&(a.host==='me'||a.members.includes('me'))&&a.when>now()&&a.when-now()<=2*3600e3){
      a.reminded=true;ch=true;
      notify(`"${short(a.desc)}" at ${a.venue} starts at ${new Date(a.when).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}. Don't be late!`,{kind:'remind',title:'Activity in 2 hours',tag:'Soon',tone:'warn',act:a.id});
    }
    if(a.status==='open'&&a.when<=now()){
      a.status='past';ch=true;
      S.reqs.filter(r=>r.act===a.id&&r.status==='pending').forEach(r=>r.status='no_action');
    }
  });
  if(ch)save();return ch;
}
function incoming(){
  const mine=S.acts.filter(a=>a.host==='me'&&a.status==='open'&&spots(a)>0);
  if(!mine.length){toast('Post an activity first, then simulate requests');return}
  const a=mine[Math.floor(Math.random()*mine.length)];
  const pool=Object.keys(USERS).filter(u=>!a.members.includes(u)&&!S.reqs.some(r=>r.act===a.id&&r.user===u)&&(a.aud==='everyone'||a.aud.includes(USERS[u].gender)));
  if(!pool.length){toast('No eligible people left for that activity');return}
  const u=pool[Math.floor(Math.random()*pool.length)];
  S.reqs.push({id:nextId('r'),act:a.id,user:u,note:NOTES[Math.floor(Math.random()*NOTES.length)],status:'pending'});
  notify(`${USERS[u].name} wants to join "${short(a.desc)}".`,{kind:'req',title:'New join request',tag:'Pending',tone:'warn',act:a.id});
}

/* ---------- verification ---------- */
function openVerify(kind,next){
  const fl=S.me[kind+'Flag'];
  ui.modal={type:'verify',kind,next,state:fl?'flagged':'idle'};render();
}
function scan(){
  const m=ui.modal;m.state='scanning';render();
  setTimeout(()=>{
    if(S.forceFail){
      S.me[m.kind+'Fails']=(S.me[m.kind+'Fails']||0)+1;
      if(S.me[m.kind+'Fails']>=5){S.me[m.kind+'Flag']=true;m.state='flagged'}else m.state='fail';
    }else{
      S.me[m.kind]=true;S.me[m.kind+'Fails']=0;
      const nx=m.next;ui.modal=null;save();toast(m.kind==='face'?'Face check passed':'ID verified');render();
      if(nx)nx();return;
    }
    save();render();
  },1300);
}
const gate=fn=>{if(S.me.kyc)fn();else openVerify('kyc',fn)};

/* ---------- swipe ---------- */
function swipe(dir){
  const a=deck()[0];if(!a)return;
  const el=document.querySelector('.card.top');
  if(dir==='right'){if(el)el.style.transform='';ui.modal={type:'confirm',id:a.id};render();return}
  if(el){el.style.transition='transform .25s';el.style.transform='translateX(-600px) rotate(-25deg)'}
  setTimeout(()=>{
    S.dismissed.push(a.id);save();
    if(!deck().length){ui.tab='discover';toast("You've seen everything nearby. Here's Discover.")}
    render();
  },230);
}
function bindDrag(){
  const el=document.querySelector('.card.top');if(!el)return;
  let sx=0,dx=0,down=false;
  const st=el.querySelector('.stamp');
  el.onpointerdown=e=>{down=true;sx=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};
  el.onpointermove=e=>{
    if(!down)return;dx=e.clientX-sx;
    el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    st.textContent=dx>0?'REQUEST':'SKIP';st.style.color=dx>0?'#A7D7A0':'#FECACA';st.style.opacity=Math.min(Math.abs(dx)/100,1);
  };
  el.onpointerup=()=>{
    if(!down)return;down=false;el.style.transition='transform .25s';
    const d=dx;dx=0;st.style.opacity=0;
    if(d>110)swipe('right');else if(d<-110)swipe('left');else el.style.transform='';
  };
}

  if(m.type==='cancelconfirm'){
    const a=actOf(m.id);if(!a)return '';
    const n=a.members.length,p=S.reqs.filter(r=>r.act===a.id&&r.status==='pending').length;
    return sheet('Cancel activity?',`<div class="sb">
      <div class="warnbox" style="margin-top:0;background:var(--badbg);border-color:#FECACA;color:var(--bad)">${I('alert-triangle',16)}<span>You're about to cancel <b>"${esc(short(a.desc))}"</b> on ${whenStr(a.when)}. This can't be undone.</span></div>
      <p class="small mute">${n?`${n} accepted ${n===1?'member':'members'} will be notified and the group chat will be closed.`:'No one has been accepted yet.'}${p?` ${p} pending ${p===1?'request':'requests'} will be dropped.`:''}</p>
      <div style="height:12px"></div><button class="btn bad" data-a="docancel" data-id="${a.id}">Yes, cancel activity</button>
      <div style="height:8px"></div><button class="btn ghost" data-a="hostview" data-id="${a.id}">Keep activity</button></div>`);
  }
  if(m.type==='host'){
    const a=actOf(m.id);if(!a)return '';
    const reqs=S.reqs.filter(r=>r.act===a.id),pend=reqs.filter(r=>r.status==='pending'),done=reqs.filter(r=>r.status!=='pending');
    const person=r=>{const p=profileOf(r.user);return `<div class="panel" style="background:var(--bg);box-shadow:none"><div class="hn">${av(r.user)}<div><strong>${esc(p.name)}</strong> <span class="vf">✓</span><div class="mute small">${esc(p.gender)}, ${p.age}${p.job?' · '+esc(p.job):''}</div></div></div><p class="small mute" style="margin:8px 0 4px">${esc(p.bio)}</p>${r.note?`<div class="dn">Note: ${esc(r.note)}</div>`:'<p class="small mute">No note attached</p>'}`;};
    return sheet('Manage activity',`<div class="sb"><div class="sum"><div class="thumb" style="background:${CATS[a.cat].g}">${I(CATS[a.cat].icon,26)}</div><div style="min-width:0"><div class="t">${esc(a.desc)}</div><div class="meta2" style="margin-bottom:6px"><span>${I('calendar',13)}${whenStr(a.when)}</span><span>${I('map-pin',13)}${esc(a.venue)}</span></div>${actChip(a.status)} <span class="chip">${a.members.length}/${a.cap} accepted</span></div></div>
      <div style="height:12px"></div>
      ${a.members.length?`<button class="btn sec" data-a="chat" data-id="${a.id}">${I('message-circle',16)} Open group chat</button>`:'<p class="small mute">Chat opens when you accept the first member.</p>'}
      <h3>Pending requests (${pend.length})</h3>
      ${pend.length?pend.map(r=>person(r)+`<div class="row" style="margin-top:10px"><button class="btn sm bad" data-a="rej" data-id="${r.id}">Decline</button><button class="btn sm ok" data-a="acc" data-id="${r.id}">Accept</button></div></div>`).join(''):'<p class="mute small">No pending requests. Use Demo tools to simulate some.</p>'}
      ${done.length?`<h3>Decided</h3>`+done.map(r=>`<div class="panel row" style="padding:12px 16px"><div class="hn">${av(r.user,'sm')}${esc(uname(r.user))}</div><div style="text-align:right">${statusChip(r.status)}</div></div>`).join(''):''}
      <div style="height:10px"></div><button class="btn bad" data-a="cancelact" data-id="${a.id}">Cancel this activity</button></div>`,'full wide');
  }
  if(m.type==='chat'){
    const a=actOf(m.id);if(!a)return '';
    const msgs=(S.chats[a.id]||[]).map(x=>x.from==='sys'?`<div class="msg sys">${esc(x.text)}</div>`:`<div class="msg ${x.from==='me'?'me':''}">${x.from==='me'?'':`<div class="who">${esc(uname(x.from))}</div>`}${esc(x.text)}</div>`).join('');
    return `<div class="ov"><div class="sheet full chat"><div class="sh"><h2 style="font-size:15px">${esc(a.desc.slice(0,34))}</h2><button class="ib" data-a="close" title="Close">${I('x',18)}</button></div>
      <p class="small mute" style="padding:8px 18px;margin:0">Members: ${[a.host,...a.members].map(uname).join(', ')} · full history visible to everyone</p>
      <div class="msgs" id="msgs">${msgs}</div><div class="cin"><input id="c_in" placeholder="Message the group" autocomplete="off"><button class="btn sm" data-a="send" data-id="${a.id}">${I('send',15)}</button></div></div></div>`;
  }
  if(m.type==='demo'){
    return sheet('Demo tools',`<div class="sb"><p class="small mute">Shortcuts so you can show the whole flow without waiting for other people. Virtual time now: <b>${fmt(now())}</b></p>
      <h3>Time</h3><div class="row"><button class="btn sm sec" data-a="adv" data-h="12">+12 hours</button><button class="btn sm sec" data-a="adv" data-h="24">+1 day</button><button class="btn sm sec" data-a="adv" data-h="72">+3 days</button></div>
      <p class="small mute" style="margin-top:8px">Moves the clock forward. Unfilled activities become Past and their pending requests become "No action from poster".</p>
      <h3>Other people</h3>
      <button class="btn sm sec" style="width:100%;margin-bottom:8px" data-a="simreq">Someone requests to join one of my activities</button>
      <button class="btn sm sec" style="width:100%;margin-bottom:8px" data-a="simacc">A host accepts my oldest pending request</button>
      <button class="btn sm sec" style="width:100%;margin-bottom:8px" data-a="simrej">A host declines my oldest pending request</button>
      <button class="btn sm sec" style="width:100%;margin-bottom:8px" data-a="simcancel">A host cancels an activity I was accepted to</button>
      <button class="btn sm sec" style="width:100%;margin-bottom:8px" data-a="simreply">Chat members send a message (open chat first)</button>
      <h3>Reset</h3><button class="btn sm bad" style="width:100%" data-a="reset">Reset whole demo</button></div>`,'full');
  }
  return '';
}

/* ---------- render: onboarding ---------- */
function onboardHtml(){
  const d=ui.ob.d;let step=ui.ob.step,body='';
  if(S.me){step=S.me.face?4:3}
  if(step===0)body=`<div class="logo" style="font-size:22px;margin-bottom:14px"><span class="dots"><i></i><i></i></span>Tagalong</div><p class="mute">Do things in your city with company. Post a plan you are already making, pick who joins. Not a dating app.</p>
    <label>Phone number</label><input id="o_phone" type="tel" placeholder="+91 98765 43210" value="${esc(d.phone||'')}">
    <label>Email</label><input id="o_email" type="email" placeholder="you@example.com" value="${esc(d.email||'')}">
    <div style="height:16px"></div><button class="btn" data-a="ob0">Continue</button>`;
  if(step===1)body=`<h1 class="pt">Verify your phone and email</h1><p class="sub">Both are verified independently.</p>
    <label>OTP sent to ${esc(d.phone)}</label><input id="o_otp" inputmode="numeric" maxlength="4" placeholder="Any 4 digits (demo)">
    <div class="dn">Demo: any 4-digit code works.</div>
    <label>Email</label><div class="panel row"><div class="small">${esc(d.email)}</div><button class="btn sm sec" style="flex:0 0 auto" id="o_mailbtn" data-a="mail">${d.mail?'✓ Confirmed':'I clicked the link'}</button></div>
    <div style="height:10px"></div><button class="btn" data-a="ob1">Continue</button>`;
  if(step===2)body=`<div class="logo" style="margin-bottom:18px"><span class="dots"><i></i><i></i></span>Tagalong</div><h1 class="pt">Create your profile</h1><p class="sub">A few details so hosts know who is asking to join.</p>
    <label>Name</label><input id="o_name" value="${esc(d.name||'')}">
    <label>Date of birth</label><input id="o_dob" type="date" value="${esc(d.dob||'')}">
    <label>Gender identity (required)</label><select id="o_gender"><option value="">Select…</option>${GENDERS.map(g=>`<option ${g===d.gender?'selected':''}>${g}</option>`).join('')}</select>
    <p class="small mute" style="margin-top:6px">Used only for the safety-oriented audience filter on posts.</p>
    <label>City</label><input value="Demo City" disabled>
    <label>Neighborhood (launch areas)</label><select id="o_hood">${HOODS.map(g=>`<option ${g===d.hood?'selected':''}>${g}</option>`).join('')}</select>
    <label>What would you want to do with company?</label>${opts('o_int',INTERESTS,d.ints)}
    <label>When are you usually free?</label>${opts('o_avail',TIMES,d.avail)}
    <div style="height:18px"></div><button class="btn" data-a="ob2">Continue</button>`;
  if(step===3)body=`<h1 class="pt">Quick face check</h1><p class="sub">Confirms your account belongs to a real person. Passing unlocks browsing.</p><div class="scan">${I('scan-face',56)}</div><button class="btn" data-a="obface">Start face check</button>`;
  if(step===4)body=`<h1 class="pt">Tell us more (optional)</h1><p class="sub">You can skip this and add it later.</p>
    <label>Profession</label><input id="o_job"><label>Bio</label><textarea id="o_bio"></textarea>
    <div style="height:16px"></div><button class="btn" data-a="obdone" data-save="1">Save and start browsing</button><div style="height:8px"></div><button class="btn sec" data-a="obdone">Skip for now</button>`;
  return `<div class="ob">${body}</div>`;
}

/* ---------- main render ---------- */
function render(){
  const scr=document.getElementById('screen');
  if(!S.me||!S.me.face||!S.me.obDone){scr.innerHTML=onboardHtml()+modalHtml();afterRender();return}
  const unread=S.notes.filter(n=>!n.read).length;
  const view={swipe:tabSwipe,discover:tabDiscover,acts:tabActs,reqs:tabReqs,profile:tabProfile,notes:tabNotes}[ui.tab]();
  const pend=S.reqs.filter(r=>r.status==='pending'&&actOf(r.act)?.host==='me').length;
  const TT=(k,l)=>`<button class="tt ${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`;
  const T=(k,ic,l)=>`<button class="${ui.tab===k?'on':''}" data-a="tab" data-t="${k}">${I(ic,20)}${l}</button>`;
  scr.innerHTML=`<header><div class="hb"><div class="logo"><span class="dots"><i></i><i></i></span>Tagalong</div>
  <div class="tnav">${TT('swipe','Swipe')}${TT('discover','Discover')}<button class="btn sm" data-a="newpost">${I('plus',15)} Create Activity</button>${TT('acts','Activities'+(pend?` (${pend})`:''))}${TT('reqs','Requests')}${TT('profile','Profile')}</div>
  <div class="hr"><button class="ib" data-a="bell" title="Notifications">${I('bell',19)}${unread?'<span class="dot"></span>':''}</button>${window.parent!==window?`<button class="ib" data-a="fb" title="Leave feedback">${I('message-circle',19)}</button>`:''}<button class="ib" data-a="demo" title="Demo tools">${I('settings-2',19)}</button><button class="ib" data-a="tab" data-t="profile" title="Profile">${av('me')}</button></div></div></header>
  <main><div class="${ui.tab==='discover'?'wrap':'narrow'}">${view}</div></main>
  <nav>${T('swipe','flame','Swipe')}${T('discover','compass','Discover')}${T('acts','calendar-check','Activities'+(pend?` (${pend})`:''))}${T('reqs','mail','Requests')}${T('profile','user','Profile')}</nav>${modalHtml()}`;
  afterRender();
}
function afterRender(){
  bindDrag();
  const ms=document.getElementById('msgs');if(ms)ms.scrollTop=ms.scrollHeight;
}

/* ---------- actions ---------- */
const val=id=>document.getElementById(id)?.value?.trim()||'';
const A={
  tab:d=>{ui.tab=d.t;ui.modal=null;render()},
  swipe:d=>swipe(d.d),
  detail:d=>{ui.modal={type:'detail',id:d.id};render()},
  hostview:d=>{ui.modal={type:'host',id:d.id};render()},
  chat:d=>{ui.modal={type:'chat',id:d.id};render()},
  close:()=>{ui.modal=null;render()},
  closebg:(d,e)=>{if(e.target.classList.contains('ov')&&ui.modal?.type!=='verify'&&ui.modal?.type!=='chat'){ui.modal=null;render()}},
  bell:()=>{ui.tab='notes';ui.modal=null;render()},
  demo:()=>{ui.modal={type:'demo'};render()},
  fb:()=>{try{window.parent.postMessage('tagalong-feedback','*')}catch(e){}},
  scan:()=>scan(),
  fcat:d=>{ui.f.cat=d.k;render()},
  ftod:d=>{ui.f.tod=d.k;render()},
  nf:d=>{ui.nf=d.k;render()},
  readall:()=>{S.notes.forEach(n=>n.read=true);save();render()},
  clearall:()=>{S.notes=[];save();render()},
  markread:d=>{const n=S.notes.find(x=>x.id===d.id);if(n)n.read=true;save();render()},
  dismiss:d=>{S.notes=S.notes.filter(x=>x.id!==d.id);save();render()},
  viewact:d=>{
    const a=actOf(d.id);if(!a)return toast('That activity is no longer available');
    ui.modal={type:a.host==='me'?'host':'detail',id:a.id};render();
  },
  newpost:()=>gate(()=>{ui.modal={type:'post'};render()}),
  submitpost:()=>{
    const desc=val('f_desc'),venue=val('f_venue'),when=new Date(document.getElementById('f_when').value).getTime();
    const all=document.getElementById('f_all').checked,gs=[...document.querySelectorAll('.f_g:checked')].map(x=>x.value);
    if(!desc||!venue)return toast('Add a description and a venue');
    if(!(when>now()))return toast('Pick a future date and time');
    if(!all&&!gs.length)return toast('Choose Everyone or at least one identity');
    S.acts.push({id:nextId('a'),host:'me',cat:val('f_cat'),desc,cap:+val('f_cap'),when,aud:all?'everyone':gs,venue,cost:val('f_cost'),hood:S.me.hood,members:[],status:'open'});
    save();ui.modal=null;ui.tab='acts';toast('Posted. Now visible to eligible people.');render();
  },
  request:d=>{
    const note=val('r_note');
    gate(()=>{
      if(!sendReq(d.id,note))return;
      ui.modal=null;
      if(ui.tab==='swipe'&&!deck().length){ui.tab='discover';toast("Request sent. You've seen everything nearby, here's Discover.")}
      render();
    });
  },
  acc:d=>{accept(d.id);render()},
  rej:d=>{reject(d.id);render()},
  askreq:d=>{ui.modal={type:'confirm',id:d.id};render()},
  cancelact:d=>{ui.modal={type:'cancelconfirm',id:d.id};render()},
  docancel:d=>{cancelAct(d.id,'me');ui.modal=null;render()},
  send:d=>{
    const t=val('c_in');if(!t)return;
    addMsg(d.id,'me',t);save();render();
    document.getElementById('c_in')?.focus();
    setTimeout(()=>{if(ui.modal?.type==='chat'&&ui.modal.id===d.id)simReply(d.id)},1400);
  },
  saveprofile:()=>{
    Object.assign(S.me,{name:val('p_name')||S.me.name,dob:val('p_dob')||S.me.dob,gender:val('p_gender'),hood:val('p_hood'),job:val('p_job'),bio:document.getElementById('p_bio').value,ints:many('p_int'),avail:many('p_avail')});
    save();toast('Profile saved');render();
  },
  adv:d=>{S.offset+=+d.h*3600e3;tick();save();toast('Moved forward '+d.h+' hours');render()},
  simreq:()=>{incoming();render()},
  simacc:()=>hostDecide(true),
  simrej:()=>hostDecide(false),
  simcancel:()=>{
    const a=S.acts.find(x=>x.host!=='me'&&x.members.includes('me'));
    if(!a)return toast('You are not accepted into any activity yet');
    cancelAct(a.id,a.host);ui.modal=null;render();
  },
  simreply:()=>{
    if(ui.modal?.type==='chat')simReply(ui.modal.id);else toast('Open a group chat first, then use this from a fresh chat');
  },
  togfail:()=>{S.forceFail=document.getElementById('d_fail').checked;save()},
  approve:()=>{['face','kyc'].forEach(k=>{if(S.me[k+'Flag']){S.me[k+'Flag']=false;S.me[k+'Fails']=0;S.me[k]=true}});save();toast('Reviewer approved flagged verifications');render()},
  resetkyc:()=>{S.me.kyc=false;S.me.kycFails=0;S.me.kycFlag=false;save();toast('ID verification reset');render()},
  reset:()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();ui=freshUi();initMe();render()},
  /* onboarding */
  ob0:()=>{
    const d=ui.ob.d;d.phone=val('o_phone');d.email=val('o_email');
    if(d.phone.replace(/\D/g,'').length<7||!/.+@.+\..+/.test(d.email))return toast('Enter a valid phone and email');
    ui.ob.step=1;render();
  },
  mail:()=>{ui.ob.d.mail=true;const b=document.getElementById('o_mailbtn');if(b)b.textContent='✓ Confirmed'},
  ob1:()=>{
    if(!/^\d{4}$/.test(val('o_otp')))return toast('Enter any 4-digit code');
    if(!ui.ob.d.mail)return toast('Confirm your email link first');
    ui.ob.step=2;render();
  },
  ob2:()=>{
    const d=ui.ob.d;d.name=val('o_name');d.dob=val('o_dob');d.gender=val('o_gender');d.hood=val('o_hood');d.ints=many('o_int');d.avail=many('o_avail');
    if(!d.name||!d.dob||!d.gender)return toast('Name, date of birth and gender identity are required');
    if(ageOf(d.dob)<18)return toast('You must be 18 or over (demo rule)');
    S.me={name:d.name,dob:d.dob,gender:d.gender,hood:d.hood,ints:d.ints,avail:d.avail,face:true,kyc:true,obDone:true};
    save();render();
  },
  obface:()=>openVerify('face',()=>render()),
  obdone:d=>{
    if(d.save)Object.assign(S.me,{job:val('o_job'),bio:val('o_bio')});
    S.me.obDone=true;save();ui.tab='swipe';render();
  }
};
function hostDecide(yes){
  const r=S.reqs.find(x=>x.user==='me'&&x.status==='pending'&&actOf(x.act));
  if(!r)return toast('You have no pending requests');
  yes?accept(r.id):reject(r.id);render();
}
function simReply(actId){
  const a=actOf(actId);if(!a)return;
  const others=[a.host,...a.members].filter(x=>x!=='me');
  if(!others.length)return;
  addMsg(actId,others[Math.floor(Math.random()*others.length)],REPLIES[Math.floor(Math.random()*REPLIES.length)]);
  save();if(ui.modal?.type==='chat'&&ui.modal.id===actId)render();
}

document.addEventListener('click',e=>{
  if(e.target.matches('input[type=checkbox]')&&e.target.id!=='d_fail'){
    if(e.target.id==='f_all'&&e.target.checked)document.querySelectorAll('.f_g').forEach(x=>x.checked=false);
    else if(e.target.classList.contains('f_g')&&e.target.checked)document.getElementById('f_all').checked=false;
  }
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='closebg'){A.closebg(el.dataset,e);return}
  const fn=A[el.dataset.a];if(fn){e.stopPropagation();fn(el.dataset,e)}
});
document.addEventListener('input',e=>{if(e.target.id==='r_note'){const c=document.getElementById('r_cnt');if(c)c.textContent=e.target.value.length}});
document.addEventListener('change',e=>{if(e.target.id==='d_date'){ui.f.date=e.target.value;render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='c_in'){const b=document.querySelector('[data-a=send]');if(b)b.click();return}
  if(e.key==='Escape'&&ui.modal&&ui.modal.type!=='verify'){ui.modal=null;render();return}
  if(ui.modal||ui.tab!=='swipe'||!S.me?.obDone||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft')swipe('left');
  else if(e.key==='ArrowRight')swipe('right');
});

function initMe(){
  if(S.me)return;
  try{
    const p=JSON.parse(localStorage.getItem('tagalong_participant'));
    if(p&&p.name&&p.gender&&p.hood)S.me={name:p.name,dob:p.dob||'1995-01-01',gender:p.gender,hood:p.hood,ints:p.ints||[],avail:p.avail||[],face:true,kyc:true,obDone:true};
  }catch(e){}
  if(S.me)save();
}
initMe();tick();render();
setInterval(()=>{if(S.me&&tick()){if(!ui.modal)render()}},30000);
</script>
</body>
</html>
