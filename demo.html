<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.amazonaws.com wss://*.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overhere</title>
<meta name="theme-color" content="#3F7D4E">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overhere">
<script src="head.js" data-manifest="manifest.webmanifest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E6;--card:#FFFDF8;--ink:#1A1A1A;--mute:#6B6B6B;--line:#E7DFCF;--field:#EFE8DA;--acc:#3F7D4E;--acch:#336842;--acc2:#E7F0E1;--accink:#2E6139;--ok:#15803D;--okbg:#DCFCE7;--bad:#B91C1C;--badbg:#FEE2E2;--warn:#A16207;--warnbg:#FEF3C7;--info:#1D4ED8;--infobg:#DBEAFE;--grey:#EFE8DA;--shadow:0 2px 14px rgba(26,26,26,.06);--r:20px;--page:#E8E0CF;--chip:#fff;--lineh:#D6CCB8;--ph:#A8A08E;--acc2h:#D8E8CF;--badh:#FECACA;--okh:#BBF7D0;--greyh:#E6DECE;--wbg:#FFFBEB;--wline:#FDE68A;--wink:#92400E;--hover:#FAF6EE;--newbg:#F4F8F0;--ink2:#3F3F3F;--okline:#A7F3D0;--mapbg:#E9E3D6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130F;--card:#201D18;--ink:#F2EDE4;--mute:#A39C8E;--line:#34302A;--field:#2A2620;--acc:#4A8F5B;--acch:#5AA06B;--acc2:#1F3325;--accink:#9FD3AA;--ok:#4ADE80;--okbg:#14301F;--bad:#F87171;--badbg:#3A1717;--warn:#FBBF24;--warnbg:#3A2E10;--info:#93C5FD;--infobg:#172A45;--grey:#2A2620;--shadow:0 2px 14px rgba(0,0,0,.35);--page:#0C0B09;--chip:#26221C;--lineh:#4A443A;--ph:#6F685C;--acc2h:#28432F;--badh:#4A1D1D;--okh:#1B3F28;--greyh:#332E27;--wbg:#33280E;--wline:#5C4812;--wink:#FCD34D;--hover:#27231D;--newbg:#1C2A1F;--ink2:#CFC8BB;--okline:#1F5134;--mapbg:#1E1B16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130F;--card:#201D18;--ink:#F2EDE4;--mute:#A39C8E;--line:#34302A;--field:#2A2620;--acc:#4A8F5B;--acch:#5AA06B;--acc2:#1F3325;--accink:#9FD3AA;--ok:#4ADE80;--okbg:#14301F;--bad:#F87171;--badbg:#3A1717;--warn:#FBBF24;--warnbg:#3A2E10;--info:#93C5FD;--infobg:#172A45;--grey:#2A2620;--shadow:0 2px 14px rgba(0,0,0,.35);--page:#0C0B09;--chip:#26221C;--lineh:#4A443A;--ph:#6F685C;--acc2h:#28432F;--badh:#4A1D1D;--okh:#1B3F28;--greyh:#332E27;--wbg:#33280E;--wline:#5C4812;--wink:#FCD34D;--hover:#27231D;--newbg:#1C2A1F;--ink2:#CFC8BB;--okline:#1F5134;--mapbg:#1E1B16;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:14.5px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--page);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.i{flex:0 0 auto;vertical-align:-3px}
#shell{position:relative;width:min(100%,420px);height:min(100dvh,880px);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(60,40,20,.18)}
@media(min-width:500px){#shell{border-radius:28px;border:8px solid #1A1A1A}}
@media(min-width:900px){#shell{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}}
#screen{display:flex;flex-direction:column;flex:1;min-height:0}

/* header + nav */
header{background:var(--card);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:1240px;margin:0 auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.02em;flex:1}
.dots{display:flex;gap:2px}.dots i{width:11px;height:11px;border-radius:50%;background:#1A1A1A;box-shadow:inset 0 0 0 2.5px var(--acc)}
.tnav{display:none;gap:4px;align-items:center}
.tt{border:0;background:none;padding:8px 16px;border-radius:99px;color:var(--mute);cursor:pointer;font-weight:500;font-size:14px;transition:.15s}
.tt:hover{color:var(--ink)}
.tt.on{background:var(--acc2);color:var(--acch)}
.hr{display:flex;align-items:center;gap:4px}
.ib{border:0;background:none;width:38px;height:38px;border-radius:50%;cursor:pointer;position:relative;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:var(--grey)}
.ib.on .av{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;flex:0 0 auto;overflow:hidden}
.av{position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:24px;height:24px;font-size:11px}
.av.lg{width:72px;height:72px;border-radius:20px;font-size:28px;box-shadow:0 6px 16px rgba(26,26,26,.12)}
.av.emo,.emogrid button{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-weight:400;line-height:1;color:#1A1A1A}
.av.emo{font-size:19px}.av.sm.emo{font-size:14px}.av.lg.emo{font-size:44px}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.emogrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--chip);border-radius:14px;font-size:26px;cursor:pointer;padding:0}
.emogrid button:hover{border-color:var(--lineh)}
.emogrid button.on{border-color:var(--acc);background:var(--acc2);box-shadow:0 0 0 2px var(--acc)}
.ph .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.epav{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.epav .row{flex-wrap:wrap}
main{flex:1;overflow-y:auto;padding:18px 16px;min-height:0}
.wrap{max-width:1180px;margin:0 auto}.narrow{max-width:620px;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:10.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500}
nav button.on{color:var(--acc);font-weight:700}
@media(min-width:900px){.tnav{display:flex}nav,.mobonly{display:none!important}.logo,.hr{flex:1 1 0}.hr{justify-content:flex-end}main{padding:28px 32px}}
@media(max-width:899px){.kb{display:none}}

/* type */
.pt{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 2px;line-height:1.2}
.sub{color:var(--mute);font-size:13px;margin:0 0 18px}
h2{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{margin:18px 0 8px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
p{margin:0 0 6px}
.mute{color:var(--mute)}.small{font-size:12.5px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd .btn{flex:0 0 auto}

/* buttons */
.btn{border:0;background:var(--acc);color:#fff;font-weight:600;padding:13px 18px;border-radius:99px;font-size:14.5px;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:hover{background:var(--acch)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--acc2);color:var(--accink)}.btn.sec:hover{background:var(--acc2h)}
.btn.bad{background:var(--badbg);color:var(--bad)}.btn.bad:hover{background:var(--badh)}
.btn.ok{background:var(--okbg);color:var(--ok)}.btn.ok:hover{background:var(--okh)}
.btn.ghost{background:var(--grey);color:var(--ink)}.btn.ghost:hover{background:var(--greyh)}
.btn.sm{width:auto;padding:8px 16px;font-size:13px}
.btn.xs{width:auto;padding:6px 12px 6px 14px;font-size:12px;gap:3px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}

/* forms */
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:14px;background:var(--field);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--ph)}
textarea{resize:none;min-height:96px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;margin:6px 0}
.chk.top{align-items:flex-start;font-size:13px;line-height:1.45}.chk.top input{margin-top:3px}
.facebox{min-height:340px;border-radius:18px;overflow:hidden;background:var(--grey);margin:4px 0 12px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12.5px;margin:14px 0 2px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;margin:0;border:1px solid var(--line);border-radius:99px;padding:9px 16px;background:var(--chip);font-weight:500;font-size:13.5px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--lineh)}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2);color:var(--accink)}
.opt input{margin:0}

/* sign in / create account */
.atab{display:flex;width:100%;margin:18px 0 20px}
.atab button{flex:1;justify-content:center;padding:9px 12px;font-size:13.5px}
.btn.out{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.out:hover{background:var(--hover);border-color:var(--lineh)}
.lrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 6px}.lrow label{margin:0}.lrow .lnk{padding:0}
.fi{position:relative}
.fi>.i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;transition:color .15s}
.fi:focus-within>.i{color:var(--acc)}
.fi input{padding-left:42px}.fi .pwi{padding-right:48px}
.fi .pwi::-ms-reveal{display:none}
.pwt{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:none;color:var(--mute);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.pwt:hover{color:var(--ink);background:var(--grey)}.pwt:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
input[aria-invalid=true],input[aria-invalid=true]:focus{border-color:var(--bad)}
.fi:has(input[aria-invalid=true])>.i{color:var(--bad)}
.ferr{display:flex;align-items:center;gap:6px;color:var(--bad);font-size:12.5px;font-weight:500;margin:6px 0 0}
.ferr:empty{display:none}.ferr.ok{color:var(--ok)}
.fhint{font-size:12.5px;color:var(--mute);margin:6px 0 0}.fhint .lnk{padding:0}
.caps{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:12.5px;font-weight:500;margin:6px 0 0}
.caps[hidden],.fhint[hidden],.fbad[hidden]{display:none}
.pws{margin-top:10px}
.pwbar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pwbar i{height:5px;border-radius:99px;background:var(--grey);transition:background .25s}
.pws[data-s="1"] .pwbar i:nth-child(-n+1){background:var(--bad)}
.pws[data-s="2"] .pwbar i:nth-child(-n+2){background:var(--warn)}
.pws[data-s="3"] .pwbar i:nth-child(-n+3){background:var(--acc)}
.pws[data-s="4"] .pwbar i{background:var(--ok)}
.pwl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:6px 0 0}
.pws[data-s="1"] .pwl b{color:var(--bad)}.pws[data-s="2"] .pwl b{color:var(--warn)}.pws[data-s="3"] .pwl b{color:var(--accink)}.pws[data-s="4"] .pwl b{color:var(--ok)}
.pwr{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--mute)}
.pwr li{display:flex;align-items:center;gap:6px;transition:color .15s}
.pwr li .i+.i,.pwr li.y .i:first-child{display:none}
.pwr li.y{color:var(--ok)}.pwr li.y .i+.i{display:inline}
.fbad{display:flex;align-items:flex-start;gap:8px;background:var(--badbg);color:var(--bad);border-radius:14px;padding:11px 14px;font-size:13px;font-weight:500;margin:0 0 12px}
.fbad .i{margin-top:1px}.fbad .lnk{padding:0;color:inherit;text-decoration:underline;font-size:inherit}
.spin{display:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.busy .spin{display:inline-block}.btn.busy{cursor:progress}.btn.busy:disabled{opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:1.8s}}
.mailic{width:64px;height:64px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:4px 0 16px}
.lnk:disabled{color:var(--mute);cursor:default}

/* panels, chips */
.panel{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel.tap{cursor:pointer;transition:transform .15s}.panel.tap:hover{transform:translateY(-1px)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--grey);color:var(--mute)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.acc{background:var(--acc2);color:var(--accink)}.chip.info{background:var(--infobg);color:var(--info)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff}
.vf{color:var(--acc);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:3px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fc{border:1px solid var(--line);background:var(--chip);padding:7px 16px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:.15s}
.fc:hover{border-color:var(--lineh)}
.fc.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.fc b{font-weight:600;background:rgba(0,0,0,.06);border-radius:99px;padding:0 7px;font-size:11px}
.fc.on b{background:rgba(255,255,255,.25)}

/* swipe */
.deck{display:flex;flex-direction:column;align-items:center;text-align:center}
.stack{position:relative;width:100%;max-width:320px;height:min(470px,60dvh);margin:0 auto}
.card{position:absolute;inset:0;border-radius:28px;color:#fff;overflow:hidden;touch-action:none;user-select:none;box-shadow:0 18px 40px rgba(26,26,26,.22);text-align:left;cursor:grab}
.card.back{transform:scale(.94) translateY(14px);opacity:.6}
.card .art{position:absolute;inset:0;display:flex;justify-content:center;padding-top:22%;color:rgba(255,255,255,.13)}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 28%,rgba(0,0,0,.5) 52%,rgba(12,9,6,.93) 100%)}
.card .cp{position:absolute;top:14px;left:14px}
.card .body{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px}
.card .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}
.card .vf{color:#A7D7A0}
.card h2{font-size:20px;line-height:1.25;margin:0 0 6px;font-weight:600}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;font-weight:500;opacity:.92;margin-top:8px}
.card .meta span{display:inline-flex;align-items:center;gap:5px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card .tags span{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
.stamp{position:absolute;top:56px;right:18px;font-size:22px;font-weight:800;border:3px solid;border-radius:10px;padding:2px 10px;transform:rotate(12deg);opacity:0;z-index:2}
.acts{display:flex;align-items:center;justify-content:center;gap:26px;padding:24px 0 6px}
.rb{width:58px;height:58px;border-radius:50%;border:0;background:var(--chip);color:var(--mute);box-shadow:0 6px 18px rgba(26,26,26,.1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.rb:hover{transform:scale(1.06)}
.rb.go{background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(63,125,78,.35)}
.cnt{font-size:11.5px;color:var(--mute);line-height:1.6}

/* discover */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.ac{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.ac:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(26,26,26,.1)}
.media{position:relative;height:150px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2)}
.media .cat{position:absolute;top:12px;left:12px}
.ac .bd{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
.ac h4{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.meta2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
.meta2 span{display:inline-flex;align-items:center;gap:5px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg span{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--grey);color:var(--mute)}
.ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.hn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.fshow{margin:0 0 12px;display:flex;align-items:center;gap:8px}
.fshow .lnk{padding:2px 4px}

/* lists */
.li{display:flex;gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85)}
.li .t{font-weight:600;font-size:14.5px;line-height:1.3}

/* modal */
.ov{position:absolute;inset:0;background:rgba(20,16,10,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.full{height:96%}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh h2{flex:1;margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px}
.sb{padding:16px 18px 20px;overflow-y:auto}
@media(min-width:720px){.ov{align-items:center;justify-content:center}.sheet{max-width:440px;border-radius:22px;max-height:90%}.sheet.full{height:auto}.sheet.wide{max-width:620px}.sheet.chat{height:80%;max-width:560px}}
.sum{display:flex;gap:14px;align-items:center;background:var(--grey);border-radius:18px;padding:14px}
