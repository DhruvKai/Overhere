<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overhere dashboard</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts/fonts.css">
<script src="../head.js"></script>
<style>
:root{--bg:#F5F0E6;--card:#FFFDF8;--ink:#1A1A1A;--mute:#6B6B6B;--line:#E7DFCF;--field:#EFE8DA;--acc:#3F7D4E;--acch:#336842;--acc2:#E7F0E1;--accink:#2E6139;--bad:#B91C1C;--badbg:#FEE2E2;--warnbg:#FFFBEB;--wline:#FDE68A;--warn:#92400E;--shadow:0 2px 14px rgba(26,26,26,.06);
  --viz:#2F8A4A;--grid:#ECE5D6;--tip:#1A1A1A;--tipink:#FFFDF8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130F;--card:#201D18;--ink:#F2EDE4;--mute:#A39C8E;--line:#34302A;--field:#2A2620;--acc:#4A8F5B;--acch:#5AA06B;--acc2:#1F3325;--accink:#9FD3AA;--bad:#F87171;--badbg:#3A1717;--warnbg:#33280E;--wline:#5C4812;--warn:#FCD34D;--shadow:0 2px 14px rgba(0,0,0,.35);--viz:#4FA566;--grid:#2C2822;--tip:#F2EDE4;--tipink:#15130F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130F;--card:#201D18;--ink:#F2EDE4;--mute:#A39C8E;--line:#34302A;--field:#2A2620;--acc:#4A8F5B;--acch:#5AA06B;--acc2:#1F3325;--accink:#9FD3AA;--bad:#F87171;--badbg:#3A1717;--warnbg:#33280E;--wline:#5C4812;--warn:#FCD34D;--shadow:0 2px 14px rgba(0,0,0,.35);--viz:#4FA566;--grid:#2C2822;--tip:#F2EDE4;--tipink:#15130F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;flex:1}
.dots{display:flex;gap:2px}.dots i{width:11px;height:11px;border-radius:50%;background:#1A1A1A;box-shadow:inset 0 0 0 2.5px var(--acc)}
main{max-width:1120px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:28px;margin:0 0 4px;font-weight:600;letter-spacing:-.02em}
h2{font-size:15px;margin:0;font-weight:600}
p{margin:0 0 10px}
.mute{color:var(--mute)}.small{font-size:13px}
.panel{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.btn{border:0;background:var(--acc);color:#fff;font-weight:600;padding:11px 20px;border-radius:99px;cursor:pointer}
.btn:hover{background:var(--acch)}
.btn.sec{background:var(--acc2);color:var(--accink)}
.btn:disabled{opacity:.55;cursor:wait}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input[type=password]{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:14px;background:var(--field);color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--acc);background:var(--card)}
.err{background:var(--badbg);color:var(--bad);padding:10px 14px;border-radius:14px;margin-top:12px;font-size:14px}
.note{background:var(--warnbg);border:1px solid var(--wline);color:var(--warn);padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:16px;margin-bottom:16px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.kpis .hero{grid-column:1/-1}}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.hero .v{font-size:56px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.ph .mute{font-size:12.5px}
/* horizontal bars: <=24px thick, 4px rounded data end, square at the baseline */
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(96px,38%) 1fr;align-items:center;gap:10px;font-size:13.5px}
.row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{display:flex;align-items:center;gap:8px;min-width:0;border-left:1px solid var(--grid);height:26px}
.fill{height:18px;background:var(--viz);border-radius:0 4px 4px 0;min-width:2px;flex:0 0 auto}
.fill.zero{min-width:0;width:0!important}
@media(min-width:900px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}}
.fill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.val{font-size:12.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
/* columns: sign-ups per day */
.cols{position:relative;height:170px;margin:4px 0 0 30px;border-bottom:1px solid var(--grid);display:flex;align-items:flex-end;gap:2px}
.cols .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.cols .yt{position:absolute;left:-30px;width:24px;text-align:right;font-size:11px;color:var(--mute);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{flex:1;max-width:24px;display:flex;align-items:flex-end;height:100%;position:relative;cursor:default}
.col i{display:block;width:100%;background:var(--viz);border-radius:4px 4px 0 0}
.col:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.xt{display:flex;justify-content:space-between;margin:6px 0 0 30px;font-size:11px;color:var(--mute)}
details{margin-top:12px;font-size:13px}
summary{cursor:pointer;color:var(--mute)}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.q{background:var(--bg);border-radius:14px;padding:14px;font-size:14px}
.q .st{color:var(--mute);font-size:12.5px;margin-bottom:6px}
.q b{font-weight:600}
.empty{color:var(--mute);font-size:13.5px;padding:8px 0}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--tip);color:var(--tipink);font-size:12.5px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:260px}
#tip.on{opacity:1}
.login{max-width:420px;margin:40px auto}
.rv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.rv:last-child{border-bottom:0}
.rv .who{flex:1;min-width:160px}.rv .btn{padding:8px 14px;font-size:13px}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="../index.html"><span class="dots"><i></i><i></i></span>Overhere</a><a class="small mute" href="../index.html#admin">Demo accounts</a></div></header>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
<script src="../config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
