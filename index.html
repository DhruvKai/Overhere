<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overhere - join the beta</title>
<meta name="theme-color" content="#3F7D4E">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script>if(location.protocol!=='file:'){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l)}
try{const t=localStorage.getItem('overhere_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F0E6;--card:#FFFDF8;--ink:#1A1A1A;--mute:#6B6B6B;--line:#E7DFCF;--field:#EFE8DA;--acc:#3F7D4E;--acch:#336842;--acc2:#E7F0E1;--accink:#2E6139;--ok:#15803D;--okbg:#DCFCE7;--bad:#B91C1C;--badbg:#FEE2E2;--warnbg:#FFFBEB;--warn:#92400E;--shadow:0 2px 14px rgba(26,26,26,.06);--chip:#fff;--acc2h:#D8E8CF;--wline:#FDE68A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130F;--card:#201D18;--ink:#F2EDE4;--mute:#A39C8E;--line:#34302A;--field:#2A2620;--acc:#4A8F5B;--acch:#5AA06B;--acc2:#1F3325;--accink:#9FD3AA;--ok:#4ADE80;--okbg:#14301F;--bad:#F87171;--badbg:#3A1717;--warnbg:#33280E;--warn:#FCD34D;--shadow:0 2px 14px rgba(0,0,0,.35);--chip:#26221C;--acc2h:#28432F;--wline:#5C4812;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130F;--card:#201D18;--ink:#F2EDE4;--mute:#A39C8E;--line:#34302A;--field:#2A2620;--acc:#4A8F5B;--acch:#5AA06B;--acc2:#1F3325;--accink:#9FD3AA;--ok:#4ADE80;--okbg:#14301F;--bad:#F87171;--badbg:#3A1717;--warnbg:#33280E;--warn:#FCD34D;--shadow:0 2px 14px rgba(0,0,0,.35);--chip:#26221C;--acc2h:#28432F;--wline:#5C4812;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:6px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;flex:1;cursor:pointer;display:flex;align-items:center;gap:9px}
.dots{display:flex;gap:2px}.dots i{width:11px;height:11px;border-radius:50%;background:#1A1A1A;box-shadow:inset 0 0 0 2.5px var(--acc)}
.tab{border:0;background:none;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--acc2);color:var(--acch)}
.tab:disabled{opacity:.4;cursor:not-allowed}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:32px;line-height:1.2;margin:0 0 10px;letter-spacing:-.02em;font-weight:600}
h2{font-size:22px;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 12px}
.mute{color:var(--mute)}.small{font-size:13.5px}
.panel{background:var(--card);border-radius:22px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.btn{border:0;background:var(--acc);color:#fff;font-weight:600;padding:13px 22px;border-radius:99px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--acch)}
.btn.sec{background:var(--acc2);color:var(--accink)}.btn.sec:hover{background:var(--acc2h)}
.btn:disabled{opacity:.55;cursor:wait}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=email],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:14px;background:var(--field);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
input[type=text]:focus,input[type=email]:focus,input[type=date]:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
textarea{min-height:96px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-weight:500;margin:0;cursor:pointer;background:var(--chip);font-size:14.5px;transition:.15s}
.opt:hover{border-color:#D6CCB8}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2);color:var(--accink)}
.opt input{margin:0}
.consent{background:var(--warnbg);border:1px solid var(--wline);border-radius:16px;padding:16px;margin-top:20px}
.consent label{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:8px 0 0;font-size:14px}
.consent input{margin-top:4px;flex:0 0 auto}
.err{background:var(--badbg);color:var(--bad);padding:10px 14px;border-radius:14px;margin-top:14px;font-size:14px}
.note{background:var(--warnbg);border:1px solid var(--wline);color:var(--warn);padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:14px}
.note a{color:var(--acch)}
.ok{background:var(--okbg);color:var(--ok);padding:12px 16px;border-radius:14px;margin-bottom:14px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.steps div{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.steps b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--acch);font-size:15px;margin-bottom:10px}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:34px;cursor:pointer;color:#E2DFD7;padding:0;line-height:1}
.stars button.on{color:var(--acc)}
.frame{width:380px;max-width:100%;height:760px;max-height:78vh;margin:0 auto;border:8px solid #1A1A1A;border-radius:30px;overflow:hidden;background:var(--card);box-shadow:0 20px 50px rgba(60,40,20,.15)}
.frame iframe{width:100%;height:100%;border:0}
.hide{display:none}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" id="logo"><span class="dots"><i></i><i></i></span>Overhere</div>
  <button class="tab" id="t_try" disabled>Try it</button>
  <button class="tab" id="t_fb">Feedback</button>
</div></header>
<main id="main"></main>

<script src="config.js"></script>
<script>
"use strict";
const CFG=window.APP_CONFIG||{};
const REMOTE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const CONSENT_VERSION='v1';
const HOODS=['Sector 17','Sector 7','Sector 22'];   // Chandigarh launch areas
/* Until the database is updated (see schema.sql, "Moved to Chandigarh"), it only accepts the old demo names.
   If a sign-up is rejected for that reason, it is saved under the matching old name instead. Safe to delete after running the SQL. */
const LEGACY_HOOD={'Sector 17':'Central Market','Sector 7':'Lakeside','Sector 22':'Old Quarter'};
const GENDERS=['Woman','Man','Non-binary'];
const INTERESTS=['Movies','Cafe / Food','Concerts'];
const TIMES=['Weekday evenings','Weekend days','Weekend evenings','Late nights'];
const PKEY='overhere_participant',LKEY='overhere_local_data';
/* One-time move of browser data saved under the app's old name (Tagalong). */
try{[['tagalong_participant',PKEY],['tagalong_local_data',LKEY]].forEach(([o,n])=>{const v=localStorage.getItem(o);if(v===null)return;if(localStorage.getItem(n)===null)localStorage.setItem(n,v);localStorage.removeItem(o)})}catch(e){}
/* Admin shortcut for testing only: the passwords are visible in the page source, so they do not protect anything.
   Each password opens a different demo account in demo.html, which keeps its own sample data. */
const ADMIN_ACCOUNTS={
  kajal:{acct:'kajal',name:'Kajal',gender:'Woman',dob:'1998-02-02',hood:'Sector 17',ints:['Movies','Cafe / Food','Concerts'],avail:['Weekday evenings','Late nights']},
  arjun:{acct:'arjun',name:'Arjun',gender:'Man',dob:'1995-09-18',hood:'Sector 17',ints:['Movies','Cafe / Food'],avail:['Weekend days','Weekend evenings']},
  neha:{acct:'neha',name:'Neha',gender:'Woman',dob:'2001-06-14',hood:'Sector 17',ints:['Cafe / Food'],avail:['Weekend days']}
};
const AKEY='overhere_acct';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
const getP=()=>{try{return JSON.parse(localStorage.getItem(PKEY))}catch(e){return null}};
const ageOf=d=>Math.floor((Date.now()-new Date(d))/31557600000);

/* ---------- storage ---------- */
async function store(table,row){
  if(REMOTE){
    const headers={apikey:CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'};
    if(CFG.SUPABASE_ANON_KEY.startsWith('eyJ'))headers.Authorization='Bearer '+CFG.SUPABASE_ANON_KEY; // legacy JWT-style anon key only
    const r=await fetch(CFG.SUPABASE_URL.replace(/\/+$/,'').replace(/\/rest\/v1$/,'')+'/rest/v1/'+table,{method:'POST',headers,body:JSON.stringify(row)});
    if(r.status===409)return 'duplicate';
    if(!r.ok&&table==='participants'&&LEGACY_HOOD[row.neighborhood]&&/neighborhood_check/.test(await r.text()))return store(table,{...row,neighborhood:LEGACY_HOOD[row.neighborhood]});
    if(!r.ok)throw new Error('Could not save ('+r.status+'). Please try again.');
    return 'ok';
  }
  const all=JSON.parse(localStorage.getItem(LKEY)||'{"participants":[],"feedback":[]}');
  if(table==='participants'&&all.participants.some(p=>p.email.toLowerCase()===row.email.toLowerCase()))return 'duplicate';
  all[table].push(row);localStorage.setItem(LKEY,JSON.stringify(all));return 'ok';
}
function download(){
  const blob=new Blob([localStorage.getItem(LKEY)||'{}'],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='overhere-local-data.json';a.click();
}
const localBanner=()=>REMOTE?'':'<div class="note">Backend not connected yet: submissions are saved in this browser only. See GO-LIVE-GUIDE.md to connect Supabase. <a href="#" id="dl">Download saved data</a></div>';

/* ---------- views ---------- */
let view='home';
function nav(v){
  view=v;const p=getP();
  $('#t_try').disabled=!p;
  $('#t_try').classList.toggle('on',v==='try');$('#t_fb').classList.toggle('on',v==='feedback');
  $('#main').innerHTML=({home,signup,try_:tryView,feedback,thanks,admin})[v==='try'?'try_':v]();
  bind();window.scrollTo(0,0);
}
function home(){
  const p=getP();
  return `<h1>Find people to do things with.</h1>
  <p class="mute">Overhere helps you turn a plan you are already making, like a movie, a coffee or a concert, into an outing with company. You post it, people ask to join, you choose who comes.</p>
  <div class="steps"><div><b>1</b>Tell us about yourself</div><div><b>2</b>Try the app in your browser</div><div><b>3</b>Tell us what you think</div></div>
  <p class="small mute">Launching first in Chandigarh. This is an early test. We are collecting a little information to learn who would use this and what should be built first. Not a dating app.</p>
  ${p?`<div class="ok">Welcome back, ${esc(p.name)}.</div><button class="btn" data-go="try">Try the platform</button> <button class="btn sec" data-go="feedback">Leave feedback</button>`
     :`<button class="btn" data-go="signup">Join the beta</button>`}`;
}
function signup(){
  return localBanner()+`<div class="panel"><h2>Join the beta</h2><p class="mute small">Takes about a minute. No phone number, no ID and no photo needed.</p>
  <form id="f">
  <div class="grid"><div><label for="name">Name</label><input type="text" id="name" required maxlength="80" autocomplete="name"></div>
  <div><label for="email">Email</label><input type="email" id="email" required maxlength="120" autocomplete="email"></div>
  <div><label for="dob">Date of birth</label><input type="date" id="dob" required></div>
  <div><label for="gender">Gender identity</label><select id="gender" required><option value="">Select…</option>${GENDERS.map(g=>`<option>${g}</option>`).join('')}</select></div></div>
  <p class="small mute" style="margin-top:6px">Gender is used only to test the audience-visibility safety control (who can see a plan).</p>
  <label for="hood">Which part of Chandigarh are you in?</label><select id="hood" required>${HOODS.map(g=>`<option>${g}</option>`).join('')}</select>
  <label>What would you want to do with company?</label><div class="opts">${INTERESTS.map(i=>`<label class="opt"><input type="checkbox" name="int" value="${i}">${i}</label>`).join('')}</div>
  <label>When are you usually free?</label><div class="opts">${TIMES.map(i=>`<label class="opt"><input type="checkbox" name="time" value="${i}">${i}</label>`).join('')}</div>
  <div class="consent"><strong>Your consent</strong>
   <label><input type="checkbox" id="c_data"> <span>I agree that Overhere may store the details above to run this beta, contact me about it, and decide what to build. I am 18 or older. I can ask for my data to be deleted at any time by emailing <b>${esc(CFG.CONTACT_EMAIL||'the beta team')}</b>. We will not sell it or share it.</span></label>
  </div>
  <div id="err"></div>
  <p style="margin-top:16px"><button class="btn" id="go" type="submit">Join and try the platform</button></p></form></div>`;
}
function admin(){
  return `<div class="panel" style="max-width:420px;margin:0 auto"><h2>Admin mode</h2><p class="mute small">Skip sign-up and go straight to the app as a sample user. Each password opens a different account with its own sample data. Nothing is sent to the backend.</p>
  <form id="f"><label for="pw">Password</label><input type="password" id="pw" autocomplete="off" required>
  <div id="err"></div><p style="margin-top:16px"><button class="btn" type="submit" style="width:100%">Enter the app</button></p></form>
  <p class="small mute" style="margin:18px 0 0;text-align:center">Looking for results? <a href="addmin/" style="color:var(--acch);font-weight:600">Open the beta dashboard</a></p></div>`;
}
function tryView(){
  return `<h2>Try the platform</h2><p class="mute small">This is a sample version with pretend people and plans. Nothing you do here is real. Try swiping, posting a plan, requesting to join, and chatting. The ⚙️ button in the app has shortcuts to simulate other people.</p>
  <p class="small" style="text-align:center"><a href="demo.html" target="_blank" rel="noopener" style="color:var(--acch);font-weight:600">Open full screen ↗</a></p>
  <div class="frame"><iframe src="demo.html?embed=1" title="Overhere demo"></iframe></div>
  <p style="text-align:center;margin-top:16px"><button class="btn" data-go="feedback">I have tried it, leave feedback</button></p>`;
}
function feedback(){
  return localBanner()+`<div class="panel"><h2>Tell us what you think</h2><p class="mute small">Honest is best. Nothing here is required except the consent box.</p>
  <form id="f">
  <label>Overall, how was it?</label><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} stars">★</button>`).join('')}</div>
  <label for="liked">What did you like?</label><textarea id="liked" maxlength="1000"></textarea>
  <label for="improve">What was confusing or missing?</label><textarea id="improve" maxlength="1000"></textarea>
  <label>Would you use this in your city?</label><div class="opts">${['Yes','Maybe','No'].map(v=>`<label class="opt"><input type="radio" name="use" value="${v}">${v}</label>`).join('')}</div>
  <div class="consent"><strong>Your consent</strong>
   <label><input type="checkbox" id="c_store"> <span><b>Required:</b> I agree that my feedback may be stored and used to improve Overhere.</span></label>
   <label><input type="checkbox" id="c_quote"> <span>Optional: you may quote my feedback publicly, without my name or email.</span></label>
   <label><input type="checkbox" id="c_contact"> <span>Optional: you may contact me with follow-up questions.</span></label>
  </div>
  <div id="err"></div>
  <p style="margin-top:16px"><button class="btn" id="go" type="submit">Send feedback</button></p></form></div>`;
}
function thanks(){
  return `<div class="panel" style="text-align:center"><div style="font-size:48px">🙏</div><h2>Thank you!</h2><p class="mute">Your response has been saved. You can keep trying the platform any time.</p>
  <button class="btn" data-go="try">Back to the platform</button></div>`;
}

/* ---------- behavior ---------- */
function showErr(m){$('#err').innerHTML=`<div class="err">${esc(m)}</div>`}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));
  const dl=$('#dl');if(dl)dl.onclick=e=>{e.preventDefault();download()};
  if(view==='signup')$('#f').onsubmit=submitSignup;
  if(view==='admin'){
    $('#pw').focus();
    $('#f').onsubmit=e=>{
      e.preventDefault();
      const ac=ADMIN_ACCOUNTS[$('#pw').value.trim().toLowerCase()];
      if(!ac)return showErr('Wrong password.');
      localStorage.setItem(AKEY,ac.acct);
      const p=getP();
      if(!p||p.admin){const {acct,...u}=ac;localStorage.setItem(PKEY,JSON.stringify({id:null,admin:true,...u}))}
      nav('try');
    };
  }
  if(view==='feedback'){
    let rating=0;
    document.querySelectorAll('#stars button').forEach(b=>b.onclick=()=>{rating=+b.dataset.n;document.querySelectorAll('#stars button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=rating))});
    $('#f').onsubmit=e=>submitFeedback(e,()=>rating);
  }
}
async function submitSignup(e){
  e.preventDefault();
  const v=id=>$('#'+id).value.trim(),many=n=>[...document.querySelectorAll(`input[name=${n}]:checked`)].map(x=>x.value);
  if(!$('#c_data').checked)return showErr('Please tick the consent box to continue.');
  if(!(ageOf(v('dob'))>=18))return showErr('You must be 18 or older to join.');
  if(!many('int').length)return showErr('Pick at least one thing you would want to do.');
  const id=uuid(),row={id,name:v('name'),email:v('email'),dob:v('dob'),gender:v('gender'),city:'Chandigarh',neighborhood:v('hood'),interests:many('int'),availability:many('time'),consent_data:true,consent_version:CONSENT_VERSION};
  $('#go').disabled=true;
  try{
    const r=await store('participants',row);
    localStorage.removeItem(AKEY);
    localStorage.setItem(PKEY,JSON.stringify({id:r==='duplicate'?null:id,name:row.name,gender:row.gender,dob:row.dob,hood:row.neighborhood,ints:row.interests,avail:row.availability}));
    nav('try');
  }catch(err){showErr(err.message);$('#go').disabled=false}
}
async function submitFeedback(e,getRating){
  e.preventDefault();
  if(!$('#c_store').checked)return showErr('Please tick the required consent box to send feedback.');
  const rating=getRating();if(!rating)return showErr('Please pick a star rating.');
  const use=document.querySelector('input[name=use]:checked');
  const p=getP();
  const row={id:uuid(),participant_id:p&&p.id||null,rating,liked:$('#liked').value.trim()||null,improve:$('#improve').value.trim()||null,would_use:use?use.value:null,consent_store:true,consent_quote:$('#c_quote').checked,consent_contact:$('#c_contact').checked,consent_version:CONSENT_VERSION};
  $('#go').disabled=true;
  try{await store('feedback',row);nav('thanks')}catch(err){showErr(err.message);$('#go').disabled=false}
}
window.addEventListener('message',e=>{if(e.data==='overhere-feedback'&&e.source===document.querySelector('iframe')?.contentWindow)nav('feedback')});
$('#logo').onclick=()=>nav('home');
$('#t_try').onclick=()=>nav('try');
$('#t_fb').onclick=()=>nav('feedback');
nav(location.hash==='#admin'?'admin':'home');   // demo accounts: no tab, opened from /addmin
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
